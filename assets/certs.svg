<svg viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Microsoft certifications 2026">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.25s} .a3{animation-delay:.4s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
    :root { --bone: #000000; --muted: #000000; --rule: #000000; --accent: #000000; }
  </style>

  <text class="mono rise a1" x="48" y="36" font-size="11" fill="var(--muted)" letter-spacing="2.5">MICROSOFT CERTIFIED - 2026</text>
  <line class="rise a2" x1="48" y1="56" x2="952" y2="56" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a2" x="48" y="96" font-size="17" font-weight="700" fill="var(--bone)">01 / AZURE AI APPS AND AGENTS DEVELOPER ASSOCIATE</text>
  <text class="mono rise a2" x="48" y="122" font-size="13" fill="var(--muted)">Building intelligent applications and agentic workflows on Microsoft Azure.</text>

  <line class="rise a3" x1="48" y1="142" x2="952" y2="142" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a3" x="48" y="178" font-size="17" font-weight="700" fill="var(--bone)">02 / FABRIC DATA ENGINEER ASSOCIATE</text>
  <text class="mono rise a3" x="48" y="204" font-size="13" fill="var(--muted)">Data engineering, analytics, and pipelines on Microsoft Fabric.</text>
</svg>
