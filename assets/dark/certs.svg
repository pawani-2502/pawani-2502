<svg viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Microsoft certifications 2026">
  <style>
    :root { --ink:#FFFFFF; --paper:#000000; }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--ink); stroke-width:1; }
    .title { fill:var(--ink); font-size:17px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:var(--ink); font-size:12px; }
    .meta { fill:var(--ink); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.15s}
    @media (prefers-reduced-motion:reduce) { .row { animation:none; opacity:1; } }
  </style>

  <g class="mono">
    <g class="row r1" transform="translate(0 20)">
      <text class="title" x="48" y="24">01 / AZURE AI APPS AND AGENTS DEVELOPER ASSOCIATE</text>
      <text class="meta" x="48" y="49">Microsoft Certified · 2026</text>
      <text class="copy" x="48" y="74">Microsoft Certified: Azure AI Apps and Agents Developer Associate (2026)</text>
      <text class="copy" x="48" y="93">Building intelligent applications and agentic workflows on Microsoft Azure.</text>
      <line class="rule" x1="48" y1="110" x2="952" y2="110"/>
    </g>
    <g class="row r2" transform="translate(0 130)">
      <text class="title" x="48" y="24">02 / FABRIC DATA ENGINEER ASSOCIATE</text>
      <text class="meta" x="48" y="49">Microsoft Certified · 2026</text>
      <text class="copy" x="48" y="74">Microsoft Certified: Fabric Data Engineer Associate (2026)</text>
      <text class="copy" x="48" y="93">Data engineering, analytics, and pipelines on Microsoft Fabric.</text>
      <line class="rule" x1="48" y1="110" x2="952" y2="110"/>
    </g>
  </g>
</svg>
